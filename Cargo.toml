[package]
name = "vektor"
version = "0.3.0"
edition = "2024"
description = "Local-first coding context engine MCP server"
license = "MIT"
rust-version = "1.91"  # required by lancedb 0.29 (transitive lance crates need 1.91); ort 2.0.0-rc.12 floor is 1.88 but the higher pin wins

[dependencies]
# MCP Protocol
rmcp = { version = "1.7", features = ["server", "transport-io"] }
tokio = { version = "1.52", features = ["full"] }

# File system
notify = "8.2"
ignore = "0.4"
walkdir = "2.5"

# AST Parsing
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"

# Embedding — ort is primary, tokenizers for input prep
ort = "=2.0.0-rc.12"               # Pinned exactly; ort 2.x is RC but actively maintained (wraps ONNX Runtime 1.24). Revisit at GA.
tokenizers = "0.23"                # HuggingFace tokenizer for ONNX model input construction
tiktoken-rs = "0.11"               # Precise token counting for two-pass budget verification (v2.3)
reqwest = { version = "0.13", features = ["json"] }
# fastembed = "5"                  # Optional convenience layer — uncomment if you prefer fastembed-rs's bundled models

# Vector Storage (LanceDB embedded)
# NOTE: Do NOT independently pin arrow versions. Let lancedb dictate the arrow version
# via its transitive dependency to avoid type-mismatch compilation failures. (v2.3 fix)
lancedb = "0.29"
# arrow, arrow-schema versions are inherited from lancedb (it re-exports arrow_schema).
# arrow-array is NOT re-exported by lancedb 0.29 (only `lancedb::arrow::arrow_schema` is),
# yet building the RecordBatches that `Table::add` consumes requires its array builders
# (StringArray, UInt32Array, FixedSizeListArray, ...). We depend on the major version
# lancedb resolves transitively ("58") rather than an exact pin, so cargo unifies it to
# the single arrow-array already in the lockfile (58.3.0) — no second arrow version, no
# type-mismatch trap. This honors the v2.3 "don't independently pin arrow" rule (it's the
# exact pin, not the dependency edge, that causes the mismatch). Used by 3.9 (insert +
# delete tests) and reused by 3.7a/3.7c.
arrow-array = "58"

# Async stream collection — collecting LanceDB query result `RecordBatch`es
# (`SendableRecordBatchStream`, which is `Stream<Item = Result<RecordBatch>>`)
# requires `futures::TryStreamExt::try_collect`. `futures` 0.3 is already in the
# lockfile transitively (via lancedb); we depend on it directly so the import is
# a first-class dependency rather than relying on a transitive edge. Used by 3.7a
# (read-before-delete cache) and reused by 3.8 (search) result collection.
futures = "0.3"

# Full-Text Search
tantivy = "0.26"

# State Storage
# rusqlite 0.39 pulls libsqlite3-sys 0.37; rusqlite 0.40 pulls libsqlite3-sys 0.38
# which uses unstable cfg_select! macro (rust-lang/rust#115585, not stable in 1.93).
# Pinned to 0.39 until libsqlite3-sys 0.38.x emits a patch release. Revisit periodically.
rusqlite = { version = "0.39", features = ["bundled"] }

# Utilities
rayon = "1.12"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive"] }
config = "0.15"
toml = "1"
dirs = "6"
indicatif = "0.18"
uuid = { version = "1", features = ["v4"] }
lru = "0.18"
sysinfo = "0.38"
# Phase 3 (task 3.10) — regex for secret pattern matching
regex = "1"

# Full debuginfo for the huge dep tree (lancedb/datafusion, ort, tantivy) is the
# main cost in link time and target/ size; line tables keep usable backtraces.
# For interactive debugger sessions, override once with:
#   CARGO_PROFILE_DEV_DEBUG=full cargo build
[profile.dev]
debug = "line-tables-only"

[dev-dependencies]
temp-env = "0.3"
tempfile = "3"
# wiremock: async HTTP mock server used by task 3.4 (openai.rs) tests.
# Dev-only — zero prod dependency surface. Integrates directly with tokio + reqwest.
wiremock = "0.6"

# Phase 2 (uncomment when needed)
# git2 = "0.21"

[[bench]]
name = "retrieval_quality"
harness = false
# Don't build+run this binary as part of `cargo test` (cargo's default for
# bench targets is test = true, which executes harness = false benches on
# every test run). Run it explicitly: cargo bench --bench retrieval_quality
test = false
