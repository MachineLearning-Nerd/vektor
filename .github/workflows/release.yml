name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name to package, for dry-run validation use a non-published ref'
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: release-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: vektor
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: vektor
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: vektor
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            binary: vektor
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: vektor.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo deps
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.release_tag }}"
            if [[ -z "${version}" ]]; then
              version="manual-dry-run-${GITHUB_SHA::12}"
            fi
          fi
          version="${version//\//-}"
          name="vektor-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          cargo metadata --locked --format-version=1 > "dist/${name}/sbom-cargo-metadata.json"
          python3 - "${{ matrix.target }}" "${GITHUB_SHA}" "dist/${name}/provenance.json" <<'PY'
          import json, sys
          target, sha, out = sys.argv[1:]
          with open(out, "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "builder": "github-actions",
                      "target": target,
                      "commit": sha,
                      "artifact": "vektor",
                      "provenance": "local-first-v0.4.0-release-workflow",
                  },
                  handle,
                  indent=2,
              )
              handle.write("\n")
          PY
          python3 - "${{ matrix.archive }}" "dist/${name}" <<'PY'
          import hashlib, pathlib, sys, tarfile, zipfile

          archive_kind, source_path = sys.argv[1:]
          source = pathlib.Path(source_path)
          extension = ".zip" if archive_kind == "zip" else ".tar.gz"
          artifact = source.parent / f"{source.name}{extension}"

          if archive_kind == "zip":
              with zipfile.ZipFile(artifact, "w", compression=zipfile.ZIP_DEFLATED) as archive:
                  for path in source.rglob("*"):
                      if path.is_file():
                          archive.write(path, path.relative_to(source.parent))
          else:
              with tarfile.open(artifact, "w:gz") as archive:
                  archive.add(source, arcname=source.name)

          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          artifact.with_name(f"{artifact.name}.sha256").write_text(
              f"{digest}  {artifact.name}\n",
              encoding="utf-8",
          )
          PY

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | head -n 1)"
          cosign sign-blob --yes \
            --output-signature "${artifact}.sig" \
            --output-certificate "${artifact}.pem" \
            "${artifact}"

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.sig
            dist/*.pem
            dist/*/sbom-cargo-metadata.json
            dist/*/provenance.json

  publish:
    name: publish-release
    runs-on: ubuntu-24.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download release builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 -c *.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.sig
            dist/*.pem
