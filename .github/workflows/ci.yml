name: CI

# Build + lint + test gate — DISABLED for cost (manual-only).
#
# macOS runners bill at 10x included minutes; this repo is in solo, private,
# doc-heavy development, so the gate now runs LOCALLY via `scripts/ci.sh`
# (run it before pushing). This workflow is retained manual-only so you can
# still trigger a full cloud build from the Actions tab before a release —
# a manual run exercises BOTH macOS + Linux, which is what you want for
# release validation.
#
# To re-enable automatic CI (e.g. at launch / when contributors arrive),
# uncomment the push/pull_request triggers below — they already carry a
# paths-ignore for docs so doc-only commits won't burn runner minutes.
#
# Full 5-platform matrix lands in task 6.2 with the release pipeline (adds
# macOS-x86_64, linux-aarch64, windows-x86_64). cargo-deny (task 0.4) still
# runs automatically in .github/workflows/audit.yml (Ubuntu-only, cheap).

on:
  workflow_dispatch:        # manual trigger only — $0 until you run it
  # push:
  #   branches: [main]
  #   paths-ignore: ['**.md', 'docs/**']
  # pull_request:
  #   branches: [main]
  #   paths-ignore: ['**.md', 'docs/**']

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only repo permissions. The build action doesn't need write.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust-toolchain.toml pins channel 1.91.0 with rustfmt+clippy.
      # The dtolnay action respects rust-toolchain.toml automatically when
      # no `toolchain:` input is supplied.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # lance-encoding's build.rs invokes protoc to generate Rust types from
      # .proto files. CI runners (ubuntu-latest, macos-latest) don't have
      # protoc installed by default. arduino/setup-protoc handles install
      # cross-platform.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo deps
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo doc (no-deps)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
